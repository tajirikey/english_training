<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>英語動詞クイズ</title>
  <style>
    :root {
      --bg: #f6f7fb;
      --panel: #ffffff;
      --panel2: #f0f3f8;
      --ink: #182033;
      --muted: #667085;
      --line: #d8deea;
      --accent: #3b5bdb;
      --accent2: #edf0ff;
      --good: #13795b;
      --good-bg: #e8f7f0;
      --bad: #b42318;
      --bad-bg: #fff1f0;
      --warn: #9a6700;
      --warn-bg: #fff7d6;
      --shadow: 0 20px 60px rgba(25, 35, 55, .10);
      --radius: 22px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top left, rgba(59, 91, 219, .13), transparent 34rem),
        linear-gradient(180deg, #fbfcff 0%, var(--bg) 100%);
      color: var(--ink);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans JP", sans-serif;
      line-height: 1.55;
    }

    .app {
      width: min(1040px, calc(100% - 28px));
      margin: 0 auto;
      padding: 28px 0 40px;
    }

    header { display: grid; gap: 14px; margin-bottom: 18px; }

    .title-row {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    h1 {
      font-size: clamp(28px, 4vw, 48px);
      line-height: 1.05;
      letter-spacing: -0.04em;
      margin: 0;
    }

    .subtitle { color: var(--muted); margin: 0; max-width: 720px; font-size: 15px; }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255, 255, 255, .78);
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
    }

    .layout {
      display: grid;
      grid-template-columns: 1fr 320px;
      gap: 18px;
      align-items: start;
    }

    .card {
      background: rgba(255,255,255,.92);
      border: 1px solid rgba(216, 222, 234, .9);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .main-card { min-height: 560px; }
    .card-inner { padding: clamp(18px, 4vw, 34px); }

    .toolbar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
      margin-bottom: 14px;
    }

    button, select, input { font: inherit; }

    button {
      border: 0;
      border-radius: 14px;
      padding: 11px 15px;
      background: var(--panel2);
      color: var(--ink);
      cursor: pointer;
      transition: transform .08s ease, background .16s ease, box-shadow .16s ease;
      font-weight: 700;
    }

    button:hover { transform: translateY(-1px); }
    button:active { transform: translateY(0); }
    button.primary { background: var(--accent); color: white; box-shadow: 0 10px 24px rgba(59,91,219,.25); }
    button.ghost { background: transparent; border: 1px solid var(--line); }
    button.danger { background: var(--bad-bg); color: var(--bad); }
    button:disabled { opacity: .45; cursor: default; transform: none; }

    .seg { display: inline-flex; padding: 4px; border-radius: 16px; background: var(--panel2); gap: 4px; flex-wrap: wrap; }
    .seg button { padding: 8px 12px; background: transparent; color: var(--muted); }
    .seg button.active { background: white; color: var(--accent); box-shadow: 0 4px 14px rgba(20,30,60,.08); }

    .field-label { color: var(--muted); font-size: 12px; font-weight: 800; margin: 14px 0 6px; letter-spacing: .02em; }

    select {
      border: 1px solid var(--line);
      background: white;
      border-radius: 14px;
      padding: 10px 12px;
      color: var(--ink);
      min-width: 130px;
    }

    .quiz-top { display: flex; justify-content: flex-end; margin-bottom: 14px; }
    .quiz-top button { padding: 7px 14px; font-size: 13px; }
    .progress-wrap { display: grid; gap: 8px; margin-bottom: 24px; }
    .progress-meta { display: flex; justify-content: space-between; color: var(--muted); font-size: 13px; }
    .bar { height: 10px; background: var(--panel2); border-radius: 999px; overflow: hidden; }
    .bar span { display: block; height: 100%; width: 0%; border-radius: inherit; background: linear-gradient(90deg, var(--accent), #748ffc); transition: width .25s ease; }

    .prompt-label { color: var(--muted); font-size: 13px; font-weight: 700; margin-bottom: 8px; }
    .cat-tag { display: inline-block; font-size: 11px; font-weight: 800; color: var(--accent); background: var(--accent2); border-radius: 999px; padding: 3px 9px; margin-bottom: 10px; }

    .jp {
      font-size: clamp(22px, 4vw, 36px);
      line-height: 1.35;
      letter-spacing: -0.02em;
      margin: 0 0 24px;
      font-weight: 800;
    }

    .sentence {
      display: grid;
      gap: 10px;
      padding: 18px;
      background: #f8f9fd;
      border: 1px solid var(--line);
      border-radius: 18px;
      margin: 0 0 18px;
    }

    .sentence-preview {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      font-size: clamp(18px, 3vw, 26px);
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .first-word { color: var(--ink); background: white; border: 1px solid var(--line); border-radius: 12px; padding: 4px 10px; }
    .blank-box { color: var(--muted); background: white; border: 1px dashed var(--line); border-radius: 12px; padding: 4px 14px; min-width: 90px; text-align: center; }

    .verb-input {
      width: min(320px, 100%);
      border: 2px solid transparent;
      background: white;
      border-radius: 14px;
      padding: 10px 12px;
      font-size: clamp(18px, 3vw, 26px);
      font-weight: 800;
      outline: none;
      box-shadow: inset 0 0 0 1px var(--line);
    }
    .verb-input:focus { border-color: rgba(59,91,219,.7); box-shadow: 0 0 0 4px rgba(59,91,219,.12); }
    .verb-input.good { border-color: rgba(19,121,91,.7); background: var(--good-bg); }
    .verb-input.bad { border-color: rgba(180,35,24,.65); background: var(--bad-bg); }

    .tail { color: var(--muted); font-weight: 700; }
    .hint-line { color: var(--muted); font-size: 13px; }

    .choice-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 4px; }
    .choice {
      text-align: left;
      padding: 14px 16px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: white;
      font-size: clamp(16px, 2.4vw, 20px);
      font-weight: 800;
    }
    .choice:hover { border-color: rgba(59,91,219,.5); }
    .choice.good { border-color: rgba(19,121,91,.8); background: var(--good-bg); color: var(--good); }
    .choice.bad { border-color: rgba(180,35,24,.8); background: var(--bad-bg); color: var(--bad); }
    .choice:disabled { opacity: 1; cursor: default; }

    .reveal-box { display: grid; gap: 10px; place-items: center; padding: 8px 0; }
    .reveal-box p { margin: 0; color: var(--muted); font-size: 14px; text-align: center; }

    .actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 18px; }

    .feedback { margin-top: 18px; border-radius: 18px; padding: 16px; display: none; }
    .feedback.show { display: block; }
    .feedback.good { background: var(--good-bg); color: var(--good); }
    .feedback.bad { background: var(--bad-bg); color: var(--bad); }
    .feedback.warn { background: var(--warn-bg); color: var(--warn); }
    .feedback strong { display: block; font-size: 18px; margin-bottom: 4px; }
    .full { color: var(--ink); font-weight: 800; margin-top: 8px; }

    .side { display: grid; gap: 14px; }
    .side .card-inner { padding: 18px; }

    .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .stat { background: #f8f9fd; border: 1px solid var(--line); border-radius: 16px; padding: 12px; }
    .stat .num { font-size: 24px; font-weight: 900; letter-spacing: -0.04em; }
    .stat .lab { color: var(--muted); font-size: 12px; font-weight: 700; }

    .list { display: grid; gap: 10px; max-height: 320px; overflow: auto; padding-right: 3px; }
    .miss-item { background: #f8f9fd; border: 1px solid var(--line); border-radius: 14px; padding: 10px; font-size: 13px; }
    .miss-item b { display: block; color: var(--ink); }
    .miss-item span { color: var(--muted); }

    .start-screen, .end-screen { display: grid; gap: 16px; }
    .start-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .option { padding: 16px; border: 1px solid var(--line); border-radius: 18px; background: #f8f9fd; }
    .option h3 { margin: 0 0 4px; font-size: 16px; }
    .option p { margin: 0; color: var(--muted); font-size: 13px; }

    .small { font-size: 13px; color: var(--muted); }
    .hidden { display: none !important; }

    .kbd { padding: 2px 7px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 6px; background: white; font-size: 12px; color: var(--muted); font-weight: 700; }

    .badge-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
    .badge { border-radius: 999px; padding: 5px 9px; background: var(--accent2); color: var(--accent); font-size: 12px; font-weight: 800; }

    @media (max-width: 860px) {
      .layout { grid-template-columns: 1fr; }
      .side { order: -1; }
      .stats { grid-template-columns: repeat(4, 1fr); }
    }
    @media (max-width: 560px) {
      .app { width: min(100% - 18px, 1040px); padding-top: 18px; }
      .start-grid { grid-template-columns: 1fr; }
      .stats { grid-template-columns: 1fr 1fr; }
      .choice-grid { grid-template-columns: 1fr; }
      .verb-input { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="title-row">
        <h1>英語動詞クイズ</h1>
      </div>
    </header>

    <div class="layout">
      <main class="card main-card">
        <div class="card-inner">
          <!-- ===== Start ===== -->
          <section id="startScreen" class="start-screen">
            <div>
              <div class="field-label">練習範囲</div>
              <div class="seg" id="modeSeg" aria-label="category">
                <button type="button" data-mode="mixed" class="active">ミックス</button>
                <button type="button" data-mode="daily">日常</button>
                <button type="button" data-mode="business">ビジネス</button>
                <button type="button" data-mode="misses">苦手だけ</button>
              </div>

              <div class="field-label">解答方法</div>
              <div class="seg" id="answerSeg" aria-label="answer method">
                <button type="button" data-answer="typing" class="active">入力する</button>
                <button type="button" data-answer="choice">選択肢から選ぶ</button>
              </div>

              <div class="field-label">問題数</div>
              <select id="lengthSelect" aria-label="問題数">
                <option value="10">10問</option>
                <option value="20" selected>20問</option>
                <option value="30">30問</option>
                <option value="all">全問</option>
              </select>

            </div>

            <div class="actions">
              <button id="startBtn" class="primary" type="button">開始</button>
              <button id="resetHistoryBtn" class="danger" type="button">成績をリセット</button>
            </div>
          </section>

          <!-- ===== Quiz ===== -->
          <section id="quizScreen" class="hidden">
            <div class="quiz-top">
              <button id="quitBtn" class="ghost" type="button">終了</button>
            </div>
            <div class="progress-wrap">
              <div class="progress-meta">
                <span id="progressText">1 / 20</span>
                <span id="timerText">0.0秒</span>
              </div>
              <div class="bar"><span id="progressBar"></span></div>
            </div>

            <p id="jpText" class="jp"></p>

            <div class="sentence">
              <div class="sentence-preview">
                <span id="firstWord" class="first-word"></span>
                <!-- typing -->
                <input id="answerInput" class="verb-input" autocomplete="off" autocapitalize="none" spellcheck="false" aria-label="動詞句" />
                <!-- choice blank -->
                <span id="blankBox" class="blank-box hidden">？</span>
                <span id="tailText" class="tail"></span>
              </div>
              <div id="hintLine" class="hint-line">ヒントは必要なときだけ表示できます。</div>

              <!-- choice: reveal step (ワンクッション) -->
              <div id="revealBox" class="reveal-box hidden">
                <p>まず頭の中で答えを思い浮かべてから、選択肢を表示しましょう。</p>
                <button id="revealBtn" class="primary" type="button">選択肢を見る</button>
              </div>
              <!-- choice: options -->
              <div id="choiceGrid" class="choice-grid hidden"></div>
            </div>

            <div class="actions">
              <button id="checkBtn" class="primary" type="button">判定</button>
              <button id="hintBtn" class="ghost" type="button">ヒント</button>
              <button id="skipBtn" class="ghost" type="button">スキップ</button>
              <button id="nextBtn" class="primary hidden" type="button">次へ</button>
            </div>

            <div id="feedback" class="feedback"></div>
          </section>

          <!-- ===== End ===== -->
          <section id="endScreen" class="end-screen hidden">
            <div>
              <div class="prompt-label">結果</div>
              <p id="endTitle" class="jp"></p>
              <p id="endSummary" class="subtitle"></p>
            </div>
            <div class="actions">
              <button id="retryMissesBtn" class="primary" type="button">間違えた問題だけ</button>
              <button id="newSessionBtn" class="ghost" type="button">新しいセッション</button>
            </div>
          </section>
        </div>
      </main>

      <aside class="side">
        <section class="card">
          <div class="card-inner">
            <div class="prompt-label">セッション</div>
            <div class="stats">
              <div class="stat"><div id="statScore" class="num">0</div><div class="lab">正解</div></div>
              <div class="stat"><div id="statWrong" class="num">0</div><div class="lab">ミス</div></div>
              <div class="stat"><div id="statStreak" class="num">0</div><div class="lab">連続</div></div>
              <div class="stat"><div id="statAvg" class="num">0.0</div><div class="lab">平均秒</div></div>
            </div>
          </div>
        </section>

        <section class="card">
          <div class="card-inner">
            <div class="prompt-label">通算成績</div>
            <div class="stats">
              <div class="stat"><div id="ovTotal" class="num">0</div><div class="lab">総回答</div></div>
              <div class="stat"><div id="ovRate" class="num">0%</div><div class="lab">正答率</div></div>
              <div class="stat"><div id="ovMiss" class="num">0</div><div class="lab">苦手数</div></div>
              <div class="stat"><div id="ovBest" class="num">0</div><div class="lab">最高連続</div></div>
            </div>
          </div>
        </section>

        <section class="card">
          <div class="card-inner">
            <div class="prompt-label">今回のミス</div>
            <div id="missList" class="list">
              <p class="small">ミスした問題がここに出ます。</p>
            </div>
          </div>
        </section>

        <section class="card">
          <div class="card-inner">
            <div class="prompt-label">操作</div>
            <p class="small"><span class="kbd">Enter</span> 判定 / 次へ<br><span class="kbd">Esc</span> 入力クリア<br><span class="kbd">?</span> ヒント<br>選択モード: <span class="kbd">1</span>〜<span class="kbd">4</span> で選択</p>
          </div>
        </section>
      </aside>
    </div>
  </div>

  <script src="questions.js"></script>
  <script src="app.js"></script>
</body>
</html>
